name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10" 
        cache: 'pip'

    - name: Instalar dependências
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install ruff mypy pytest # Instala as ferramentas de qualidade

    - name: Checar formatação e lint com Ruff
      run: |
        ruff check .
        ruff format --check .

    - name: Checar tipagem com Mypy
      run: mypy app/

    - name: Rodar testes com Pytest
      run: pytest